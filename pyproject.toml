[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gst-resilient-agent"
version = "0.1.0"
description = "A multi-step GST rate-opinion agent, and the chaos testing that measures where it breaks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# The agent loop, the tool contract, tracing, the chaos middleware, the scorer
# and the task suite are stdlib-only. That is deliberate: `make test` has to
# work on a fresh clone before anyone runs pip install, and a reliability
# harness whose own dependencies can fail is measuring the wrong thing.
#
# Everything below is an extra, and each one names what it costs.
dependencies = []

[project.optional-dependencies]
# Tools 3 and 5 read the archived notifications, which are PDFs.
gazette = ["pypdf>=5.0"]

# Document ingestion (agent/ingest.py) and the adversarial PDF fixtures in
# chaos/documents.py.
#
# PyMuPDF is **AGPL-3.0** and this project is MIT, which is why it is an extra
# and not a dependency: nothing in the default install links it, `make test`
# skips the ingestion tests without it, and agent/ingest.py falls back to pypdf
# (BSD) when it is absent. Anyone redistributing a build that includes this
# extra takes on the AGPL obligation; that is their decision to make knowingly
# rather than one inherited from a requirements file.
ingest = ["pymupdf>=1.24"]

# Optional Postgres/pgvector backend. The agent never imports it: it depends on
# agent.retrieval_service.RetrievalService, and storage/ implements that. With
# no DATABASE_URL the repository is a no-op and retrieval uses the in-memory
# index, so this changes deployment rather than architecture.
storage = ["psycopg[binary]>=3.1"]

# The default model path — NVIDIA's API catalog, and a self-hosted NIM
# container on the same wire format — needs NOTHING. It is one POST with a JSON
# body over stdlib urllib, so `pip install -e '.[gazette]'` plus a key is a
# complete working install. This extra exists only for the optional Anthropic
# comparison row.
anthropic = ["anthropic>=0.40"]

# The MCP server, and the client the agent uses to reach it.
mcp = ["mcp>=1.2"]

# Project 01, pinned. Supplies the scorer, the label space and the Gazette
# lookup. Install a local checkout with `pip install -e ../domain-eval-harness`
# instead when working on both at once.
eval = [
    "gst-eval-harness @ git+https://github.com/ardhendudebnath/gst-eval-harness@096acedff9e8792b4240062b2c7c5c4b44b05f64",
]

dev = ["pytest>=8.0", "ruff>=0.6"]

# Everything, for a full adversarial run. Note this pulls in the AGPL-3.0
# ingest extra; use the named extras instead if that matters to you.
all = [
    "gst-resilient-agent[gazette,ingest,storage,anthropic,mcp,eval,dev]",
]

[tool.setuptools.packages.find]
include = ["agent*", "chaos*", "suite*", "mcp_gazette*", "storage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
